name: sync-preview
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sancovp/aisaac
          ref: ceo
          path: src
      - run: |
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'src' src/ ./
          rm -rf src
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add -A
          git commit -m "sync preview from aisaac@ceo" || echo "no changes"
          git push
